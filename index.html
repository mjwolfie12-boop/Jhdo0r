<!DOCTYPE html>
<html>
<head>
    <title>Birthday</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <p></p>
        <h1>Happy Birthday! 🎂</h1>
        <p>buriq gapapa lah ya, ntar kubuatin yang lebih bagus kalo aku dah jago</p>
        <p>umur berapa? 16th ya? selamat</p>

        <div class="gift" onclick="bukaHadiah()">
            🎁
        </div>

        <p id="hint">Klik kotaknya!</p>

        <div id="gallery">

            <img src="foto%201.jpg" class="foto">
            <img src="foto%202.jpg" class="foto">
            <img src="foto%203.jpg" class="foto">
            <img src="foto%204.jpg" class="foto">
            <img src="foto%205.jpg" class="foto">
            <img src="foto%206.jpg" class="foto">
            <img src="foto%207.jpg" class="foto">
            <img src="foto%208.jpg" class="foto">
            <img src="xilonen.png" class="stiker-xilonen">
            <img src="caine.png" class="stiker-caine">

        </div>

    </div>

    <script>

        function bukaHadiah() {

            document.querySelector(".gift").innerHTML = "🎉";

            document.getElementById("hint").innerHTML =
                "wkwkwk aku ga punya banyak fotomu hehe :D";

            const foto = document.querySelectorAll(".foto");

            foto.forEach((gambar, index) => {

                setTimeout(() => {
                    gambar.classList.add("muncul");
                }, index * 1500);

            });

        }

    </script>
    <p>selamat ulang tahun Joaquin Valent Eandri Putra</p>
    <!-- Bagian Audio -->
<audio id="background-music" loop>
    <source src="lagu.mp3" type="audio/mpeg">
    Browser kamu tidak mendukung pemutar audio.
</audio>

<!-- Tombol Musik (Opsional tapi disarankan agar tidak diblokir HP) -->
<button id="music-btn" onclick="toggleMusic()" style="position: fixed; bottom: 20px; left: 20px; z-index: 999; padding: 10px 15px; border-radius: 20px; background: #d85c82; color: white; border: none; cursor: pointer;">
    🎵 Putar Musik
</button>

<script>
function toggleMusic() {
    var music = document.getElementById("background-music");
    var btn = document.getElementById("music-btn");
    if (music.paused) {
        music.play();
        btn.innerHTML = "⏸️ Matikan Musik";
    } else {
        music.pause();
        btn.innerHTML = "🎵 Putar Musik";
    }
}
</script>
    
</body>

</html>
